<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Entry history">
    <div class="brand"><h1>Daily Journal</h1><p id="today"></p></div>
    <div class="stats">
      <div><b id="sStreak">0</b><span>day streak</span></div>
      <div><b id="sEntries">0</b><span>entries</span></div>
      <div><b id="sWords">0</b><span>words</span></div>
    </div>
    <input type="search" id="search" placeholder="Search entries" aria-label="Search entries">
    <div class="filter">
      <input type="date" id="filter" aria-label="Show entries from date">
      <button class="link" id="clear">Show all</button>
    </div>
    <div id="list" class="timeline" aria-live="polite"></div>
  </aside>

  <main class="desk">
    <article class="page">
      <div class="page-top">
        <input type="date" id="date" aria-label="Entry date">
        <div class="moods" id="moods" role="group" aria-label="Mood"></div>
      </div>
      <div id="note" class="note" hidden></div>
      <input id="title" maxlength="150" placeholder="Give today a title" aria-label="Title">
      <textarea id="body" placeholder="Start writing…" aria-label="Entry"></textarea>
      <ul id="hints" class="hints" hidden></ul>
      <div class="bar">
        <button class="btn" id="save">Save entry</button>
        <button class="btn ghost" id="newPrompt">Get a writing prompt</button>
        <button class="btn ghost" id="suggest">Suggest what to write next</button>
        <button class="btn ghost" id="fresh">New entry</button>
        <span class="grow"></span>
        <span id="count" class="muted">0 words</span>
        <button class="btn danger" id="del" hidden>Delete</button>
      </div>
    </article>
  </main>
</div>
<div id="toast" class="toast" role="status"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
